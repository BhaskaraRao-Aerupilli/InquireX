<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InquireX — Autonomous Deep Research Engine</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />

  <!-- Zero-Flash Theme Preload before Stylesheets -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('inquirex_theme_mode');
        var legacy = localStorage.getItem('inquirex_theme');
        if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
          mode = (legacy === 'dark' || legacy === 'light') ? legacy : 'system';
        }
        var resolved = mode;
        if (mode === 'system') {
          resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-mode', mode);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Typography: Inter, Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- InquireX Modular Design System -->
  <link rel="stylesheet" href="/site/css/tokens.css?v=7" />
  <link rel="stylesheet" href="/site/css/base.css?v=7" />
  <link rel="stylesheet" href="/site/css/components.css?v=7" />
  <link rel="stylesheet" href="/site/css/shell.css?v=7" />
  <link rel="stylesheet" href="/site/css/views.css?v=7" />
  <link rel="stylesheet" href="/site/css/companion.css?v=7" />
</head>
<body>
  <div id="app"></div>

  <!-- Preserved Core Client-Side Markdown, Sanitization & Graph Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/1.9.1/showdown.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js" crossorigin="anonymous"></script>

  <!-- InquireX ES6 Module Entry -->
