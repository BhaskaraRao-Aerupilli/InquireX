<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — InquireX</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />

  <!-- Zero-Flash Theme Initialization synced with Workspace -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('inquirex_theme_mode');
        var legacy = localStorage.getItem('inquirex_theme');
        if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
          mode = (legacy === 'dark' || legacy === 'light') ? legacy : 'system';
        }
        var resolved = mode;
        if (mode === 'system') {
          resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-mode', mode);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="/site/css/tokens.css?v=3" />
  <link rel="stylesheet" href="/site/css/base.css?v=3" />
  <link rel="stylesheet" href="/site/css/components.css?v=3" />

  <style>
    .ix-auth-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-6) var(--space-4);
      background-color: var(--bg-secondary);
      position: relative;
    }

    .ix-auth-topbar {
      position: absolute;
      top: 18px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ix-auth-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: var(--space-8);
    }

    .ix-auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: var(--space-6);
    }

    .ix-auth-mark {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      background-color: var(--accent-primary-soft);
      border: 1px solid var(--border-default);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ix-auth-wordmark {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .ix-auth-wordmark span {
      color: var(--accent-primary);
    }

    .ix-auth-alert {
      display: none;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      line-height: 1.5;
      margin-bottom: var(--space-4);
    }

    .ix-auth-alert.show {
      display: block;
    }

    .ix-auth-alert.error {
      background-color: var(--status-error-soft);
      border: 1px solid var(--status-error-border);
      color: var(--status-error);
    }

    .ix-auth-alert.success {
      background-color: var(--status-success-soft);
      border: 1px solid var(--status-success-border);
      color: var(--status-success);
    }

    .ix-auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: var(--space-5) 0;
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    .ix-auth-divider::before,
    .ix-auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--border-subtle);
    }

    .ix-auth-footer {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: ixSpin 0.65s linear infinite;
      display: none;
    }

    @keyframes ixSpin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .ix-auth-card {
        padding: var(--space-6) var(--space-5);
      }
      .ix-auth-topbar {
        top: 12px;
        right: 12px;
      }
    }
  </style>
</head>
<body class="ix-auth-page">
  <div class="ix-auth-topbar">
    <button
      type="button"
      class="ix-btn ix-btn-secondary ix-btn-sm"
      id="themeToggleBtn"
      title="Cycle Light / Dark / System Theme"
    >
      <i id="themeIcon" class="fa-solid fa-desktop"></i>
      <span id="themeLabel">System</span>
    </button>
  </div>

  <main class="ix-auth-card">
    <div class="ix-auth-brand">
      <span class="ix-auth-mark" aria-hidden="true">
        <svg class="inquirex-logo-svg" width="24" height="24" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="ixp1Login" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="50%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
            <linearGradient id="ixp2Login" x1="30" y1="2" x2="2" y2="30" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#818cf8" />
              <stop offset="100%" stop-color="#4f46e5" />
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="13.5" stroke="url(#ixp1Login)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="28 10 12 10" class="ix-gyro-ring" />
          <path d="M9.5 9.5L22.5 22.5" stroke="url(#ixp1Login)" stroke-width="2.75" stroke-linecap="round" />
          <path d="M22.5 9.5L9.5 22.5" stroke="url(#ixp2Login)" stroke-width="2.75" stroke-linecap="round" />
          <circle cx="16" cy="16" r="3.4" fill="var(--bg-card)" stroke="url(#ixp1Login)" stroke-width="1.5" />
          <circle cx="16" cy="16" r="1.5" fill="var(--accent-primary)" class="ix-focal-core" />
        </svg>
      </span>
      <span class="ix-auth-wordmark">Inquire<span>X</span></span>
      <span class="ix-badge" style="margin-left:auto;">Intelligence Engine</span>
    </div>

    <h1 style="font-size:var(--text-xl); margin-bottom:4px;">Welcome back</h1>
    <p class="ix-help" style="margin-bottom:var(--space-5);">
      Sign in to access your autonomous deep research workspace.
    </p>

    <div class="ix-auth-alert error" id="alertError" role="alert"></div>
    <div class="ix-auth-alert success" id="alertSuccess" role="status"></div>

    <form id="loginForm" novalidate style="display:flex; flex-direction:column; gap:var(--space-4);">
      <div class="ix-field">
        <label class="ix-label" for="email">Email address</label>
        <input type="email" id="email" class="ix-input" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="ix-field">
        <label class="ix-label" for="password">Password</label>
        <input type="password" id="password" class="ix-input" placeholder="••••••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="ix-btn ix-btn-primary ix-btn-lg" id="loginBtn" style="width:100%;">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Sign In</span>
      </button>
    </form>

    <div class="ix-auth-divider">or continue with</div>

    <a href="/auth/google" style="text-decoration:none; display:block;">
      <button type="button" class="ix-btn ix-btn-secondary ix-btn-lg" style="width:100%;">
        <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.4 30.3 0 24 0 14.8 0 6.9 5.4 3 13.3l7.8 6.1C12.6 13.2 17.9 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/>
          <path fill="#FBBC05" d="M10.8 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L2.5 13.3A24 24 0 0 0 0 24c0 3.8.9 7.4 2.5 10.7l8.3-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.1 0-11.4-3.7-13.2-9l-7.8 6c3.9 7.8 11.8 13.3 21 13.3z"/>
        </svg>
        Sign in with Google
      </button>
    </a>

    <p class="ix-auth-footer">
      Don't have an account? <a href="/auth/register-page">Create one</a>
    </p>
  </main>

  <script type="module">
    import { applyThemeMode, getThemeMode, cycleThemeMode } from '/site/js/theme.js';

    function syncAuthThemeButton(mode, resolved) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (icon) {
        icon.className = mode === 'system'
          ? 'fa-solid fa-desktop'
          : resolved === 'dark'
          ? 'fa-solid fa-moon'
          : 'fa-solid fa-sun';
      }
      if (label) {
        label.textContent = mode === 'system' ? 'System' : resolved === 'dark' ? 'Dark' : 'Light';
      }
    }

    const initial = applyThemeMode(getThemeMode(), false);
    syncAuthThemeButton(initial.mode, initial.resolved);

    window.addEventListener('inquirex:themechange', (e) => {
      if (e.detail) syncAuthThemeButton(e.detail.mode, e.detail.resolved);
    });

    document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
      cycleThemeMode();
    });

    const params = new URLSearchParams(location.search);
    if (params.get('error')) {
      const msgs = {
        google_auth_failed: 'Google sign-in was cancelled or failed.',
        token_exchange_failed: 'Failed to complete Google sign-in. Try again.',
        userinfo_failed: 'Could not retrieve Google account info.',
        db_error: 'Account creation failed. Please try again.',
        no_email: 'Google did not provide an email address.',
      };
      showAlert('error', msgs[params.get('error')] || 'An error occurred. Please try again.');
    }

    function showAlert(type, msg) {
      const el = document.getElementById('alert' + (type === 'error' ? 'Error' : 'Success'));
      if (el) {
        el.textContent = msg;
        el.classList.add('show');
      }
    }
    function hideAlerts() {
      document.getElementById('alertError')?.classList.remove('show');
      document.getElementById('alertSuccess')?.classList.remove('show');
    }

    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlerts();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('error', 'Please enter your email and password.');
        return;
      }

      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Signing in...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok) {
          showAlert('success', 'Welcome back! Redirecting to workspace...');
          setTimeout(() => { window.location.href = '/'; }, 700);
        } else {
          showAlert('error', data.detail || 'Invalid email or password.');
        }
      } catch {
        showAlert('error', 'Network error. Please check your connection.');
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
